[project]
name = "discord-sms-bot"
version = "0.1.0"
description = "Discord slash-command bot for consent-based SMS sending through Twilio"
requires-python = ">=3.13"
dependencies = [
    "discord-py>=2.7.1",
    "twilio>=9.13.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
